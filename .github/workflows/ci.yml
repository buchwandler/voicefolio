name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Voicefolio development tooling
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Run Ruff
        run: ruff check .
      - name: Run mypy
        run: mypy voicefolio
      - name: Validate packaged catalogs
        run: |
          voicefolio catalog verify voicefolio/resources/catalogs/kyutai-tts-voices.json
          voicefolio validate
      - name: Build wheel and sdist
        run: python -m build
