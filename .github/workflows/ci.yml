name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Voicefolio development tooling
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -r docs/requirements.txt twine
      - name: Run tests
        run: python -m pytest -q
      - name: Run Ruff
        run: ruff check .
      - name: Run mypy
        run: mypy voicefolio
      - name: Type-check public API fixture
        run: python -m mypy --config-file tests/typecheck/mypy.ini tests/typecheck/public_api.py
      - name: Build documentation
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - name: Validate packaged catalogs
        run: |
          voicefolio catalog verify voicefolio/resources/catalogs/kyutai-tts-voices.json
          voicefolio catalog verify voicefolio/resources/catalogs/fine-read-it-voices.json
          voicefolio catalog verify voicefolio/resources/catalogs/voice-zero.json
          voicefolio validate
      - name: Build wheel and sdist
        run: python -m build

  release-artifacts:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build, validation, and smoke dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -r docs/requirements.txt twine
      - name: Build wheel and sdist
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Check release artifacts and sdist rebuild
        run: python tools/check_release_artifacts.py --artifacts dist
      - name: Smoke-test installed wheel outside the checkout
        run: python tools/smoke_installed.py --artifacts dist
