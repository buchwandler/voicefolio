# Build and publish the Voicefolio Python package when a GitHub Release is published.

name: Publish Voicefolio Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release
        uses: actions/checkout@v7

        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Voicefolio build tooling
        run: python -m pip install --upgrade pip build twine 'setuptools>=80' 'setuptools-scm>=9.2' wheel 'typer>=0.20,<1'
      - name: Build Voicefolio package
        run: |
          rm -rf dist
          python -m build
      - name: Check built distributions
        run: python -m twine check dist/*
      - name: Validate Voicefolio release artifacts
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python tools/check_release_artifacts.py --artifacts dist --release-tag "$RELEASE_TAG"
      - name: Smoke-test installed wheel
        run: python tools/smoke_installed.py --artifacts dist
      - name: Publish Voicefolio package to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
