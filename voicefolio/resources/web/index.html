<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Voicefolio</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 1100px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      header {
        display: flex;
        gap: 1rem;
        align-items: baseline;
        flex-wrap: wrap;
      }
      input,
      select {
        padding: 0.55rem;
        font: inherit;
      }
      input {
        min-width: 20rem;
        flex: 1;
      }
      .voice {
        border-top: 1px solid #ddd;
        padding: 1rem 0;
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 1rem;
      }
      .ref {
        font-family: ui-monospace, monospace;
        font-weight: 650;
      }
      .meta {
        color: #555;
        font-size: 0.9rem;
        margin-top: 0.35rem;
      }
      audio {
        width: 100%;
      }
      @media (max-width: 700px) {
        .voice {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Voicefolio</h1>
      <span id="count"></span>
    </header>
    <p>
      Stable IDs, source licenses, pinned revisions, and verified WAV previews.
    </p>
    <div style="display: flex; gap: 0.6rem; flex-wrap: wrap">
      <input id="q" placeholder="Search stable ID or dataset" autofocus />
      <select id="license">
        <option value="">All licenses</option>
      </select>
      <select id="dataset">
        <option value="">All datasets</option>
      </select>
    </div>
    <main id="voices"></main>
    <script>
      let rows = [];
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c])
        );
      function options(id, key) {
        const el = document.getElementById(id);
        [...new Set(rows.map((x) => x[key]))].sort().forEach((v) => {
          const o = document.createElement("option");
          o.value = v;
          o.textContent = v;
          el.appendChild(o);
        });
      }
      function render() {
        const q = document.getElementById("q").value.toLowerCase();
        const lic = document.getElementById("license").value;
        const ds = document.getElementById("dataset").value;
        const filtered = rows.filter(
          (x) =>
            (!q ||
              x.ref.toLowerCase().includes(q) ||
              x.dataset.toLowerCase().includes(q)) &&
            (!lic || x.license === lic) &&
            (!ds || x.dataset === ds)
        );
        document.getElementById(
          "count"
        ).textContent = `${filtered.length} / ${rows.length} voices`;
        document.getElementById("voices").innerHTML = filtered
          .map(
            (x) =>
              `<section class="voice"><div><div class="ref">${esc(
                x.ref
              )}</div><div class="meta">${esc(x.dataset)} · ${esc(
                x.variant
              )} · ${esc(x.license)}<br>${esc(x.source_repository)} @ ${esc(
                x.source_revision.slice(0, 12)
              )} · sha256:${esc(
                x.sha256.slice(0, 12)
              )}…</div></div><audio controls preload="none" src="/api/audio?ref=${encodeURIComponent(
                x.ref
              )}"></audio></section>`
          )
          .join("");
      }
      fetch("/api/voices")
        .then((r) => r.json())
        .then((data) => {
          rows = data;
          options("license", "license");
          options("dataset", "dataset");
          render();
        });
      ["q", "license", "dataset"].forEach((id) =>
        document.getElementById(id).addEventListener("input", render)
      );
    </script>
  </body>
</html>
